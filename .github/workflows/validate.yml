name: Validate skill and numerical invariants
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python skills/tsymperturb/scripts/tsymperturb.py examples/synthetic_model.json --output outputs/synthetic_results.json
  optional-fitting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt -r requirements-fitting.txt
      - run: python -m pytest -q
      - run: python skills/tsymperturb/scripts/fit_tsymperturb.py examples/synthetic_paired.json --n-boot 10 --seed 42 --output outputs/bootstrap.json
      - run: python docs/validation/run_audit.py
      - run: python docs/validation/mc_audit.py
